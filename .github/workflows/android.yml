name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test rule engine
        run: |
          mkdir -p /tmp/guard-tests
          javac -encoding UTF-8 -d /tmp/guard-tests app/src/main/java/io/shakeguard/app/RuleEngine.java app/src/main/java/io/shakeguard/app/EventTiming.java tests/RuleEngineTest.java
          java -cp /tmp/guard-tests io.shakeguard.app.RuleEngineTest
      - name: Build and lint
        run: gradle assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: shake-guard-debug
          path: app/build/outputs/apk/debug/*.apk
